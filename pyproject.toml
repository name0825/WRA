[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wra"
version = "0.1.0"
description = "Web Redesigner AI"
requires-python = ">=3.12"
dependencies = [
    "ollama",
    "pydantic",
    "PyYAML",
]

[project.optional-dependencies]
test = [
    "pytest",
]
browser = [
    "playwright",
]

[project.scripts]
redesign = "wra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
